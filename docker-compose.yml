version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: shoe_store_db
    restart: always
    environment:
      POSTGRES_DB: shoe_store
      POSTGRES_USER: shoe_admin
      POSTGRES_PASSWORD: shoe1234
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoe_admin -d shoe_store"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
